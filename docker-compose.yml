# The service and the database it persists to.
#
#   docker compose up -d db      Postgres alone, for the CLI and `pytest -m db`.
#                                Then: alembic upgrade head
#   docker compose up --build    The whole thing. Needs a filled-in .env; the
#                                container applies its own migrations at start.
#
# Reset everything, including the data:  docker compose down -v

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reviewhive
      POSTGRES_PASSWORD: reviewhive
      POSTGRES_DB: reviewhive
    ports:
      # Another Postgres on 5432 is the usual first-run failure, and on a machine
      # running more than one project it is the normal case rather than the
      # exception. Override with POSTGRES_PORT in .env (compose reads it) and
      # match it in REVIEWHIVE_DATABASE_URL, rather than editing this file.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reviewhive-pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory only. If reviewhive_test is missing
      # after editing this, the volume already existed: docker compose down -v.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Not decoration: the app service a later phase adds will want
      # `depends_on: {db: {condition: service_healthy}}`, and "accepting
      # connections" is the only useful definition of ready here.
      test: ["CMD-SHELL", "pg_isready -U reviewhive -d reviewhive"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # Optional so `docker compose up -d db` still works in a clone with no .env —
    # that is the documented way to run the CLI and the db tests, and neither
    # needs credentials.
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides whatever .env says, and that is the point. A .env written for
      # local development points at localhost, which inside this network is the
      # container itself; the value would win and fail with a connection refused
      # that reads as the database being down rather than as the wrong host.
      REVIEWHIVE_DATABASE_URL: postgresql+asyncpg://reviewhive:reviewhive@db:5432/reviewhive
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        # Not `service_started`. The entrypoint runs `alembic upgrade head`
        # before uvicorn, so a database that is merely up but not yet accepting
        # connections fails the container at start.
        condition: service_healthy

volumes:
  reviewhive-pgdata:
