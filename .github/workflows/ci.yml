# Continuous integration.
#
# Three jobs, because the suite has three installation stories and a green run on
# the wrong one proves very little. Six test modules gate themselves on an optional
# extra with `pytest.importorskip`, so a job installing only `.[dev]` skips 62 of
# 327 tests and still reports success — it would never run the webhook, startup,
# mention or model tests at all. Both test jobs therefore assert that nothing was
# skipped, which turns that failure from silent into loud.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The suite must never make a network call or spend money. No API key is exposed
# to any job here, and none should be: `conftest.py` clears ANTHROPIC_API_KEY so an
# accidental real client fails loudly, and a credential in the environment would
# undermine that. Actions injects its own GITHUB_TOKEN into every job, which is
# harmless only because `Settings` reads REVIEWHIVE_GITHUB_TOKEN and deliberately
# does not alias the bare name.
env:
  PYTHON_VERSION: "3.13"

# Naming the shell explicitly is what sets `pipefail`. The implicit default is
# `bash -e`, under which `pytest | tee` reports tee's exit code and a failing
# suite passes the step.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    name: test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # All three extras, not just `dev`. See the note at the top of this file.
      - run: pip install -e ".[dev,db,service]"

      - name: Run the offline suite
        run: pytest --cov --cov-report=term-missing | tee result.txt

      - name: Fail if any test was skipped
        run: |
          if grep -q "skipped" result.txt; then
            echo "::error::Tests were skipped. The extras are probably missing —"
            echo "::error::this job must install .[dev,db,service], not .[dev]."
            exit 1
          fi

  db:
    name: test (database)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reviewhive
          POSTGRES_PASSWORD: reviewhive
          POSTGRES_DB: reviewhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewhive -d reviewhive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REVIEWHIVE_TEST_DATABASE_URL: postgresql+asyncpg://reviewhive:reviewhive@localhost:5432/reviewhive_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,db,service]"

      # `docker/initdb/01-test-db.sql` creates this locally, but a service
      # container never runs initdb scripts — there is no volume to mount them
      # from. Without this step every db test skips itself.
      - name: Create the test database
        env:
          PGPASSWORD: reviewhive
        run: psql -h localhost -U reviewhive -d reviewhive -c 'CREATE DATABASE reviewhive_test OWNER reviewhive'

      # No `alembic upgrade head` step: the `migrated_database` fixture runs the
      # migration itself, in a subprocess, and failing there is the signal we want.
      # Doing it here as well would hide a broken fixture behind a working step.
      - name: Run the database tests
        run: pytest -m db | tee result.txt

      - name: Fail if any test was skipped
        run: |
          if grep -q "skipped" result.txt; then
            echo "::error::Database tests were skipped rather than run."
            echo "::error::REVIEWHIVE_TEST_DATABASE_URL is unset or names the wrong database."
            exit 1
          fi
