[project]
name = "reviewhive"
version = "0.1.0"
description = "Multi-agent AI code review bot for GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.120.2",
    "langgraph==1.2.10",
    "unidiff==1.0.0",
    "pydantic==2.12.3",
    "pydantic-settings==2.12.0",
]

[project.optional-dependencies]
# Kept separate so a Phase 1 install stays small. `db` is split from `service`
# because persistence arrived a phase before the webhook: running the CLI against
# Postgres should not pull in a web server.
db = [
    "sqlalchemy[asyncio]==2.0.44",
    "asyncpg==0.30.0",
    "alembic==1.18.5",
]
service = [
    "reviewhive[db]",
    "fastapi==0.121.2",
    "uvicorn[standard]==0.40.0",
    "httpx==0.28.1",
]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewhive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pin the fixture loop scope rather than inheriting the implicit default: asyncpg
# connections bind to the loop that created them, so this has to be deliberate
# before any async database fixture exists.
asyncio_default_fixture_loop_scope = "function"
# The deselection is what makes a bare `pytest` offline and free — the marked
# tests are skipped before anything imports a database driver or a real client.
# `pytest -m db` overrides it; a command-line -m beats this one.
addopts = "-q --strict-markers -m 'not db and not live'"
markers = [
    "live: hits the real Anthropic API and costs money; deselected by default",
    "db: requires a live Postgres (REVIEWHIVE_DATABASE_URL); deselected by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# Migration bodies are written by `alembic revision --autogenerate` in its own
# style. Reformatting them means re-doing it after every generation, and a
# migration that has been hand-edited for line length is harder to trust than one
# that is plainly what the tool emitted. `migrations/env.py` is hand-written and
# stays linted.
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["src/reviewhive"]

[tool.coverage.report]
# Set just under what the offline suite measures today, which is what CI runs.
# Deliberately not the combined figure: adding `-m db` covers most of
# `repository.py` and would push this past what a bare `pytest --cov` can reach,
# turning the local command into a failure nobody caused.
#
# A floor rather than a target. It exists to make a drop visible in the diff that
# caused it, not to be raised until the number looks impressive.
fail_under = 93
show_missing = true
